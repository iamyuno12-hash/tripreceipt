# 배포(시연)용 정적 서버 설정.
#
# 중요: 아래 두 헤더가 없으면 SharedArrayBuffer 를 쓸 수 없어서
# onnxruntime-web 의 멀티스레드 WASM 이 비활성화되고 OCR 이 크게 느려진다.
# vite.config.ts 의 개발 서버 설정과 반드시 같은 값을 유지한다.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # cross-origin isolation (SharedArrayBuffer 활성화 조건)
    add_header Cross-Origin-Opener-Policy   same-origin   always;
    add_header Cross-Origin-Embedder-Policy require-corp  always;

    # wasm 은 MIME 타입이 정확해야 스트리밍 컴파일이 된다.
    types {
        application/wasm wasm;
    }

    # OCR 모델(.tar)과 wasm 은 내용이 바뀌지 않으므로 길게 캐시한다.
    # 첫 진입 때만 내려받고 이후에는 재사용되게 하는 것이 목적이다.
    location ~* \.(wasm|tar|onnx)$ {
        add_header Cross-Origin-Opener-Policy   same-origin   always;
        add_header Cross-Origin-Embedder-Policy require-corp  always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA 라우팅: 없는 경로는 index.html 로 넘긴다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # .tar/.wasm 은 이미 압축 효과가 적고 CPU 만 쓰므로 gzip 대상에서 제외한다.
}
