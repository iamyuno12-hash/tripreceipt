services:
  # 평소 개발용. 소스를 고치면 브라우저가 자동으로 갱신된다.
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      # node_modules 는 호스트와 공유하지 않는다 (OS별 네이티브 모듈 충돌 방지).
      - node-modules:/workspace/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    tty: true

  # 시연용. 빌드된 정적 파일을 nginx 로 서비스한다 (COOP/COEP 헤더 포함).
  serve:
    image: nginx:1.27-alpine
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - dev

volumes:
  node-modules:
